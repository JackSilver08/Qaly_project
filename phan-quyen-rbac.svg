<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".14"/></filter>
    <style>
      text{font-family:Arial,'Segoe UI',sans-serif;fill:#163A63} .h{font-weight:700;fill:white;font-size:28px}
      .t{font-weight:700;font-size:24px}.s{font-size:21px}.role{font-weight:700;font-size:22px}
      .box{fill:white;stroke:#1677ff;stroke-width:2}.soft{fill:#eef7ff;stroke:#58a5ff;stroke-width:2}
      .line{fill:none;stroke:#1677ff;stroke-width:4}.dash{fill:none;stroke:#1677ff;stroke-width:3;stroke-dasharray:8 9}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1677ff"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f8fcff"/>

  <!-- RBAC flow -->
  <g filter="url(#shadow)">
    <rect class="box" x="45" y="45" width="310" height="285" rx="20"/><path fill="#1677ff" d="M65 45h270a20 20 0 0 1 20 20v62H45V65a20 20 0 0 1 20-20z"/>
    <rect class="box" x="430" y="45" width="310" height="285" rx="20"/><path fill="#1677ff" d="M450 45h270a20 20 0 0 1 20 20v62H430V65a20 20 0 0 1 20-20z"/>
    <rect class="box" x="815" y="45" width="310" height="285" rx="20"/><path fill="#1677ff" d="M835 45h270a20 20 0 0 1 20 20v62H815V65a20 20 0 0 1 20-20z"/>
    <rect class="box" x="1200" y="45" width="355" height="285" rx="20"/><path fill="#1677ff" d="M1220 45h315a20 20 0 0 1 20 20v62h-355V65a20 20 0 0 1 20-20z"/>
  </g>
  <text class="h" x="200" y="98" text-anchor="middle">NGƯỜI DÙNG</text><text class="h" x="585" y="98" text-anchor="middle">VAI TRÒ</text>
  <text class="h" x="970" y="98" text-anchor="middle">QUYỀN HẠN</text><text class="h" x="1377" y="98" text-anchor="middle">PHẠM VI</text>
  <g class="s" text-anchor="middle"><text x="200" y="181">Người dùng 1</text><text x="200" y="237">Người dùng 2</text><text x="200" y="293">Người dùng n</text></g>
  <g class="role" text-anchor="middle"><text x="585" y="166">Admin</text><text x="585" y="215">Manager</text><text x="585" y="264">Project Owner</text><text x="585" y="313">Project Member</text></g>
  <g class="s" text-anchor="middle"><text x="970" y="166">Quản lý</text><text x="970" y="215">Tạo / Sửa</text><text x="970" y="264">Xem</text><text x="970" y="313">Tương tác</text></g>
  <g class="s" text-anchor="middle"><text x="1377" y="195">Quyền hạn được áp dụng</text><text x="1377" y="235">trong phạm vi</text><text x="1377" y="275">tài nguyên được cấp</text></g>
  <path class="line" marker-end="url(#arrow)" d="M355 187h62"/><path class="line" marker-end="url(#arrow)" d="M740 187h62"/><path class="line" marker-end="url(#arrow)" d="M1125 187h62"/>

  <!-- Scope hierarchy -->
  <rect x="150" y="400" width="300" height="70" rx="14" fill="#0e4a8b"/><text class="h" x="300" y="445" text-anchor="middle">TỔ CHỨC</text>
  <path class="line" d="M300 470v45M300 515H160v35M300 515h140v35"/>
  <rect x="80" y="550" width="160" height="60" rx="12" fill="#1677ff"/><rect x="360" y="550" width="160" height="60" rx="12" fill="#1677ff"/>
  <text class="h" x="160" y="590" text-anchor="middle">NHÓM A</text><text class="h" x="440" y="590" text-anchor="middle">NHÓM B</text>
  <path class="line" marker-end="url(#arrow)" d="M160 610v55"/><rect class="soft" x="70" y="668" width="180" height="60" rx="12"/><text class="t" x="160" y="707" text-anchor="middle">DỰ ÁN X</text>
  <path class="line" d="M160 728v40M160 768H80v24M160 768h150v24"/>
  <rect class="soft" x="20" y="792" width="180" height="60" rx="12"/><rect class="soft" x="220" y="792" width="180" height="60" rx="12"/>
  <text class="t" x="110" y="830" text-anchor="middle">NHIỆM VỤ</text><text class="t" x="310" y="830" text-anchor="middle">THÀNH VIÊN</text>

  <!-- Role-to-scope mapping -->
  <g>
    <path class="dash" d="M450 435h245"/><path class="dash" d="M520 580h175"/><path class="dash" d="M250 698h445"/><path class="dash" d="M400 822h295"/>
    <rect x="700" y="402" width="245" height="66" rx="13" fill="#0e4a8b"/><rect x="700" y="547" width="245" height="66" rx="13" fill="#1677ff"/><rect class="soft" x="700" y="665" width="245" height="66" rx="13"/><rect class="soft" x="700" y="789" width="245" height="66" rx="13"/>
    <text class="h" x="822" y="444" text-anchor="middle">Admin</text><text class="h" x="822" y="589" text-anchor="middle">Manager</text><text class="role" x="822" y="707" text-anchor="middle">Project Owner</text><text class="role" x="822" y="831" text-anchor="middle">Project Member</text>
    <path class="line" marker-end="url(#arrow)" d="M945 435h75"/><path class="line" marker-end="url(#arrow)" d="M945 580h75"/><path class="line" marker-end="url(#arrow)" d="M945 698h75"/><path class="line" marker-end="url(#arrow)" d="M945 822h75"/>
    <rect class="soft" x="1030" y="402" width="500" height="66" rx="13"/><rect class="soft" x="1030" y="547" width="500" height="66" rx="13"/><rect class="soft" x="1030" y="665" width="500" height="66" rx="13"/><rect class="soft" x="1030" y="789" width="500" height="66" rx="13"/>
    <text class="t" x="1280" y="444" text-anchor="middle">Toàn tổ chức</text><text class="t" x="1280" y="589" text-anchor="middle">Theo nhóm</text><text class="t" x="1280" y="707" text-anchor="middle">Theo dự án</text><text class="t" x="1280" y="831" text-anchor="middle">Theo nhiệm vụ được giao</text>
  </g>
  <rect x="500" y="865" width="1000" height="1" fill="#d5eaff"/>
</svg>
