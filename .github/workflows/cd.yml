# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# ========================================
# Qaly Project - CD Pipeline (Continuous Deployment)
# Tự động deploy khi merge vào main
# ========================================

name: 🚀 CD - Publish Image

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.editorconfig'

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # Job 1: Build Docker Image & Push to GHCR
  # ==========================================
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # Deployment targets are not configured yet. This workflow publishes
  # a production image; environment deployment remains an explicit ops step.
  # ==========================================
  publish-summary:
    name: 📋 Publish Summary
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Record published image
        run: |
          {
            echo "### Container image published"
            echo ""
            echo "- Registry: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "- Commit tag: \`${{ github.sha }}\`"
            echo "- Environment deployment: not configured"
          } >> "$GITHUB_STEP_SUMMARY"
