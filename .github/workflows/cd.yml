# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# ========================================
# Qaly Project - CD Pipeline (Continuous Deployment)
# Tự động deploy khi merge vào main
# ========================================

name: 🚀 CD - Publish Verified Image

on:
  workflow_run:
    workflows: ["CI - Build, Test, and Smoke"]
    types: [completed]
    branches: [ main ]

concurrency:
  group: publish-production-image
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # Job 1: Build Docker Image & Push to GHCR
  # ==========================================
  build-and-push:
    name: 🐳 Build & Push Docker Image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  # ==========================================
  # Deployment targets are not configured yet. This workflow publishes
  # a production image; environment deployment remains an explicit ops step.
  # ==========================================
  publish-summary:
    name: 📋 Publish Summary
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ always() && needs.build-and-push.result == 'success' }}

    steps:
      - name: Record published image
        run: |
          {
            echo "### Container image published"
            echo ""
            echo "- Registry: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "- Verified commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Source CI conclusion: \`${{ github.event.workflow_run.conclusion }}\`"
            echo "- Environment deployment: not configured"
          } >> "$GITHUB_STEP_SUMMARY"
