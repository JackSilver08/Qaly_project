# ========================================
# Qaly Project - CI Pipeline (Continuous Integration)
# Tự động build + test khi push hoặc tạo PR
# ========================================

name: 🔄 CI - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  # ==========================================
  # Job 1: Build & Unit Tests
  # ==========================================
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore NuGet packages
        run: dotnet restore

      - name: 🏗️ Build solution
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 Run Unit Tests
        run: dotnet test tests/Qaly.UnitTests/ --no-build --configuration Release --logger "trx;LogFileName=unit-test-results.trx" --collect:"XPlat Code Coverage"

      - name: 🔍 Security Scan (Vulnerable Packages)
        run: dotnet list package --vulnerable

      - name: 📏 Check Code Coverage (Placeholder)
        run: |
          # TODO: Implement coverage check. Fail if coverage < 70%.
          # Example: reportgenerator -reports:**/coverage.cobertura.xml -targetdir:coveragereport -reporttypes:Html
          echo "Coverage check placeholder"

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: '**/TestResults/**'
          retention-days: 30

  # ==========================================
  # Job 2: Integration Tests (with SQL Server)
  # ==========================================
  integration-tests:
    name: 🗄️ Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TestPassword123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TestPassword123! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore packages
        run: dotnet restore

      - name: 🏗️ Build
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 Run Integration Tests
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=QalyDb_Test;User Id=sa;Password=TestPassword123!;TrustServerCertificate=True;MultipleActiveResultSets=true"
          Redis__ConnectionString: "localhost:6379"
        run: dotnet test tests/Qaly.IntegrationTests/ --no-build --configuration Release --logger "trx;LogFileName=integration-test-results.trx"

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: '**/TestResults/**'
          retention-days: 30

  # ==========================================
  # Job 3: Code Quality
  # ==========================================
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore packages
        run: dotnet restore

      - name: 🔍 Run code analysis
        run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=false /p:EnforceCodeStyleInBuild=true

      - name: 📏 Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic || echo "::warning::Code formatting issues detected"
