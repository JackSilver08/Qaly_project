name: CI - Build, Test, and Smoke

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build, Unit Tests, Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore NuGet
        run: dotnet restore

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

      - name: Verify committed frontend bundle
        id: verify_frontend_bundle
        run: git diff --exit-code -- src/Qaly.Web/wwwroot/dist

      - name: Upload generated frontend bundle on mismatch
        if: ${{ failure() && steps.verify_frontend_bundle.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle-${{ github.sha }}
          path: src/Qaly.Web/wwwroot/dist
          if-no-files-found: error
          retention-days: 1

      - name: Validate configuration safety
        shell: pwsh
        run: ./scripts/check-configuration.ps1

      - name: Validate configuration parity
        shell: pwsh
        run: ./scripts/check-config-parity.ps1

      - name: Validate secret and log hygiene
        shell: pwsh
        run: ./scripts/check-security-hygiene.ps1

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests with coverage
        run: >
          dotnet test tests/Qaly.UnitTests/Qaly.UnitTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=unit-test-results.trx"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory .test-results/unit

      - name: Enforce unit coverage baseline
        shell: pwsh
        run: ./scripts/check-coverage.ps1 -CoverageRoot .test-results/unit -MinimumLineRate 43

      - name: NuGet vulnerability scan
        shell: pwsh
        run: ./scripts/check-vulnerable-packages.ps1

      - name: npm production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload unit test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: .test-results/unit
          retention-days: 30

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TestPassword123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TestPassword123! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run integration tests with coverage
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=QalyDb_Test;User Id=sa;Password=TestPassword123!;TrustServerCertificate=True;MultipleActiveResultSets=true"
          Redis__ConnectionString: "localhost:6379"
          Ai__SemanticEnabled: "false"
        run: >
          dotnet test tests/Qaly.IntegrationTests/Qaly.IntegrationTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=integration-test-results.trx"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory .test-results/integration

      - name: Enforce integration coverage baseline
        shell: pwsh
        run: ./scripts/check-coverage.ps1 -CoverageRoot .test-results/integration -MinimumLineRate 16

      - name: Upload integration test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: .test-results/integration
          retention-days: 30

  e2e-smoke:
    name: Playwright E2E Smoke
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TestPassword123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TestPassword123! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore NuGet
        run: dotnet restore

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build web app
        run: dotnet build src/Qaly.Web/Qaly.Web.csproj --no-restore --configuration Release

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start app
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5000
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=QalyDb_E2E;User Id=sa;Password=TestPassword123!;TrustServerCertificate=True;MultipleActiveResultSets=true"
          Redis__ConnectionString: "localhost:6379"
          QALY_SEED_ADMIN_PASSWORD: "Qaly@E2E2026!"
          QALY_SEED_DEFAULT_USER_PASSWORD: "Qaly@E2E2026!"
          Ai__SemanticEnabled: "false"
        run: |
          dotnet run --project src/Qaly.Web/Qaly.Web.csproj --configuration Release --no-build --no-launch-profile --urls http://127.0.0.1:5000 > qaly-e2e.log 2>&1 &
          echo $! > qaly-e2e.pid
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat qaly-e2e.log
          exit 1

      # The suite shares one app/database instance and mutates canonical data.
      # Run it serially so one scenario cannot invalidate another scenario's state.
      - name: Run Playwright smoke tests (serial shared state)
        env:
          E2E_BASE_URL: http://127.0.0.1:5000
          E2E_ADMIN_EMAIL: admin@qaly.dev
          E2E_ADMIN_PASSWORD: "Qaly@E2E2026!"
          E2E_WORKERS: "1"
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            qaly-e2e.log
          retention-days: 30

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet
        run: dotnet restore

      - name: Build with analyzers
        run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=false /p:EnforceCodeStyleInBuild=true

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic || echo "::warning::Code formatting issues detected"

  container-build:
    name: Production Container Build & Runtime Contract
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TestPassword123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TestPassword123! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          tags: qaly:ci

      - name: Verify production image runs non-root
        run: |
          IMAGE_USER="$(docker image inspect qaly:ci --format '{{.Config.User}}')"
          if [ -z "$IMAGE_USER" ] || [ "$IMAGE_USER" = "0" ] || [ "$IMAGE_USER" = "root" ]; then
            echo "Production image must declare a non-root user; found '$IMAGE_USER'."
            exit 1
          fi
          echo "Production image user: $IMAGE_USER"

      - name: Start production image with concrete release configuration
        run: |
          docker run --detach \
            --name qaly-production-contract \
            --add-host host.docker.internal:host-gateway \
            --publish 5011:5000 \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env ASPNETCORE_URLS=http://+:5000 \
            --env ProductionReadiness__DeploymentId=ci-${{ github.sha }} \
            --env ProductionReadiness__PublicBaseUrl=https://qaly-ci.local \
            --env ProductionReadiness__AiDecision=disabled-accepted \
            --env ProductionReadiness__PrivacyDecision=disabled-accepted \
            --env DataProtection__KeysPath=/app/dp-keys \
            --env 'ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=QalyContainerContract;User Id=sa;Password=TestPassword123!;TrustServerCertificate=True;MultipleActiveResultSets=true' \
            --env Redis__ConnectionString=host.docker.internal:6379 \
            --env InvitationLink__FrontendBaseUrl=https://qaly-ci.local \
            --env AllowedHosts=qaly-ci.local\;localhost\;127.0.0.1 \
            --env UseInMemoryDatabase=false \
            --env Seed__UseRichDemoSeed=false \
            --env LiveKit__ServerUrl= \
            --env LiveKit__ApiKey= \
            --env LiveKit__ApiSecret= \
            --env AiJobsV4__Enabled=false \
            --env AiJobsV4__WorkerEnabled=false \
            --env PrivacyV4__Enabled=false \
            --env PrivacyV4__WorkerEnabled=false \
            --env PrivacyV4__EnforceSensitiveIngestion=false \
            qaly:ci

          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:5011/health/ready > health-ready.json; then
              cat health-ready.json
              exit 0
            fi
            if [ "$(docker inspect qaly-production-contract --format '{{.State.Running}}')" != "true" ]; then
              docker logs qaly-production-contract
              exit 1
            fi
            sleep 2
          done
          docker logs qaly-production-contract
          exit 1

      - name: Verify image health state
        run: |
          for attempt in {1..20}; do
            STATUS="$(docker inspect qaly-production-contract --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}')"
            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi
            if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "missing" ]; then
              docker inspect qaly-production-contract --format '{{json .State.Health}}'
              exit 1
            fi
            sleep 2
          done
          docker inspect qaly-production-contract --format '{{json .State.Health}}'
          exit 1

      - name: Upload production runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-container-contract-${{ github.sha }}
          path: health-ready.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop production contract container
        if: always()
        run: |
          docker logs qaly-production-contract > production-container.log 2>&1 || true
          docker rm --force qaly-production-contract 2>/dev/null || true
